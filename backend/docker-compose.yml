services:
  flexibooker-db:
    image: postgres:16
    container_name: flexibooker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flexibooker
    ports:
      - "5432:5432"
    volumes:
      - flexibooker_db_data:/var/lib/postgresql/data

volumes:
  flexibooker_db_data:
